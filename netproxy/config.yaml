name: "Net Proxy (网络代理)"
version: "0.1.9"
slug: "netproxy"
description: >-
  网络代理与镜像加速面板：总开关 + 三种代理方式（Docker 加速镜像 / 上游 HTTP-SOCKS5 代理与订阅 / 内置
  WireGuard 出口）。直接作用于 Docker 守护进程，使 Home Assistant 系统更新与插件（Add-on）安装的镜像拉取走代理。
url: "https://github.com/AvalonO98/ha-proxy-accelerator"
# 预构建镜像：Supervisor 会拉取 <image>:<version>。
# 必须用预构建镜像的原因：目标 HA 上 Docker Hub 不可达，而 Supervisor 本地构建
# add-on 时需要从 Docker Hub 拉构建器镜像(docker:<ver>-cli)，本地构建必然失败。
# 由 .github/workflows/build-netproxy.yml 构建并推送（多架构 manifest）。
image: "ghcr.io/avalono98/ha-proxy-accelerator"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_entry: /
panel_admin: true
panel_icon: mdi:shield-network
panel_title: "网络代理"
# 需要操作宿主机的 dockerd 配置，所以必须进入宿主网络/PID 命名空间
host_network: true
host_pid: true
# AppArmor 会拦截 setns(进入宿主命名空间)，必须关闭
apparmor: false
# 注意：Supervisor 的「保护模式」**无法由插件自己声明**。
#   ATTR_PROTECTED 只存在于 SCHEMA_APP_USER（用户持久化数据），默认 True；
#   而 supervisor/docker/app.py 里 host_pid 与 docker_api 只在 `not protected` 时才应用：
#       def pid_mode(self): return "host" if not self.app.protected and self.app.host_pid else None
#   因此保护模式默认开启时，插件拿不到宿主 PID 命名空间、也没有 docker socket，
#   方式 A/B/C 全部失效。解决办法（二者其一）：
#     1) 插件面板上的「一键修复权限」→ 调用 /addons/self/security 关闭保护模式并重启；
#     2) 手动在插件页面关闭「保护模式」后重启插件。
protected: false   # 仅作备注：该键不在 add-on config schema 中，会被 Supervisor 忽略
privileged:
  - SYS_ADMIN        # nsenter/setns 进入宿主 mount 命名空间
  - SYS_PTRACE       # 打开 /proc/1/ns/mnt 需要 ptrace 权限（HA 内核 YAMA ptrace_scope 会拦）
  - NET_ADMIN
  - NET_RAW
  - DAC_READ_SEARCH
# 读取 dockerd 实时配置(/info 里的 Registry Mirrors / Proxy)用于"真实生效"校验
docker_api: true
hassio_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web UI（默认不发布；仅在 ingress 不可用时手动映射，无 HA 鉴权，请自行加防护）"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
map:
  - share:rw
options:
  enabled: false
  mode: docker_mirror
  mirrors:
    - "https://docker.m.daocloud.io"
    - "https://docker.1ms.run"
  github_mirrors:
    - "https://ghfast.top/"
  upstream:
    type: none
    url: ""
    username: ""
    password: ""
  subscription:
    url: ""
    # 注意：这个键不能叫 name——Supervisor 要求嵌套配置组的翻译里必须有一个
    # 字符串型的 name（组显示名），与"叫 name 的选项"冲突会导致 translations 读取失败。
    profile: ""
  wireguard:
    config: ""
  kernel_url: ""
  kernel_version: ""
  dns:
    - "223.5.5.5"
    - "119.29.29.29"
  auto_rollback: true
  health_check_seconds: 300
  apply_timeout_seconds: 180
  log_level: info
schema:
  enabled: bool
  mode: list(docker_mirror|upstream_proxy|wireguard)
  mirrors:
    - str
  github_mirrors:
    - str
  upstream:
    type: list(none|http|socks5)
    url: str?
    username: str?
    password: password?
  subscription:
    url: str?
    profile: str?
  wireguard:
    config: str?
  kernel_url: str?
  kernel_version: str?
  dns:
    - str
  auto_rollback: bool
  health_check_seconds: int(30,3600)
  apply_timeout_seconds: int(30,900)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
