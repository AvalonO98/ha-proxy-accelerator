name: HA 代理加速器
slug: proxy_accelerator
description: >
  代理 + 加速一体面板：① 自选上游(HTTP/SOCKS5)的可开关正向代理入口；
  ② Docker Hub / GHCR / GitHub 镜像加速：内置常用加速镜像与可达性检测，
     一键生成宿主侧配置向导；③ HACS 官方组件更新加速(可开关补丁，备份可回滚)。
version: "0.3.0"
url: https://github.com/AvalonO98/ha-proxy-accelerator
# 预构建镜像: 由 .github/workflows/build.yml 构建多架构清单推送到 ghcr
# 通用引用名(不带 tag): Supervisor 用 version 作为 tag 拉取, 故 tag 必须与 version 一致
image: "ghcr.io/avalono98/ha-proxy-accelerator"
# 当前发布 amd64 镜像(你的 ESXi 环境); 其它架构可后续用官方 builder action 扩展
arch:
  - amd64
startup: application
boot: auto
init: false

# 正向代理入口, 发布到宿主机供局域网客户端/其它容器使用
ports:
  8899/tcp: 8899
ports_description:
  8899/tcp: "HTTP(S)/SOCKS5 正向代理入口（默认 8899，可改）"

# 面板由 Supervisor Ingress 反代: 容器内 8099
ingress: true
ingress_port: 8099
ingress_entry: /

# 允许访问 Supervisor API(用于 HACS 补丁后一键重启 Home Assistant; 令牌经
# $SUPERVISOR_TOKEN 注入, Supervisor 地址 http://supervisor)与读写 /config
hassio_api: true
map:
  - config: rw

# 首次安装时的默认选项(装好后在面板里改即可, 面板配置保存在 /data)
options:
  enabled: false
  mode: http
  upstream: 127.0.0.1:7890
  upstream_user: ""
  upstream_pass: ""
  acl_mode: whitelist
  hacs_patch_enabled: false
  hacs_github_proxy: "https://ghfast.top/"

# schema 采用类型描述字符串(bool/str/password/match(正则)); 枚举用 match 约束,
# 兼容新版 Supervisor(Apps) 的严格校验 —— 不接受 dict 式 type/name 或裸列表下拉
schema:
  enabled: bool
  mode: "match(^(direct|http|socks5)$)"
  upstream: str
  upstream_user: str
  upstream_pass: password
  acl_mode: "match(^(whitelist|global)$)"
  hacs_patch_enabled: bool
  hacs_github_proxy: str
