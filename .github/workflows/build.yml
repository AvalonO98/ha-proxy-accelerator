name: Build & push add-on image (ghcr)

on:
  push:
    branches: [main]
    paths:
      - "proxy-accelerator/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# 需要仓库 Settings → Actions → General → Workflow permissions 设为 Read and write
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/avalonO98/ha-proxy-accelerator
  VERSION: 0.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
          - arch: armv7
            platform: linux/arm/v7
            base: ghcr.io/home-assistant/armv7-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: proxy-accelerator
          file: proxy-accelerator/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/avalonO98/ha-proxy-accelerator/${{ matrix.arch }}:${{ env.VERSION }}
            ghcr.io/avalonO98/ha-proxy-accelerator/${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
