name: Build & push app image (ghcr multi-arch)

on:
  push:
    branches: [main]
    paths:
      - "proxy-accelerator/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# 需要仓库 Settings → Actions → General → Workflow permissions 设为 Read and write
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/avalono98/ha-proxy-accelerator
  VERSION: "0.3.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: proxy-accelerator
          file: proxy-accelerator/Dockerfile
          platforms: linux/amd64
          push: true
          # 通用引用: Supervisor 按 <image>:<version> 拉取
          tags: |
            ghcr.io/avalono98/ha-proxy-accelerator:${{ env.VERSION }}
            ghcr.io/avalono98/ha-proxy-accelerator:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest
            BUILD_VERSION=${{ env.VERSION }}
